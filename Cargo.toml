[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/engine",
    "crates/protocol",
    "crates/term",
    "crates/ui",
    "crates/views",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
# UI
gpui-kit = "=0.9.0"

# Runtime / IO
async-channel = "2"
base64 = "0.22"
directories = "6"
ed25519-dalek = "2"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "sync",
    "io-util",
    "net",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

# Data / errors / observability
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
harness-core = { path = "crates/core" }
harness-engine = { path = "crates/engine" }
harness-protocol = { path = "crates/protocol" }
harness-ui = { path = "crates/ui" }
harness-views = { path = "crates/views" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
